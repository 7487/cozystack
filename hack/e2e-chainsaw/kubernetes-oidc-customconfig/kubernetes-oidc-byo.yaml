# No KubernetesNodes pool is created — this test asserts on the
# KamajiControlPlane and the tenant-supplied issuer AuthenticationConfiguration
# Secret, and needs no worker node for either. It does need a serving tenant
# control plane, because its last step waits for the release to finish
# installing; see the kubernetes-oidc-system suite header.
#
# Since the Phase 2 split the kubernetes chart renders the control plane only
# (worker pools are separate KubernetesNodes resources), so there are zero
# MachineDeployments, KubevirtMachines or worker DataVolumes — no DRBD churn
# between CI runs (see #3231).
#
# Unlike the bats original, no talos.imageFactoryURL block is injected here:
# the helper emits it only when the in-sandbox Talos image cache is up, and
# with zero worker replicas this fixture instantiates no DataVolume imports for
# it to redirect — the static fixture stays equivalent.
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: oidc-byo
spec:
  addons:
    ingressNginx:
      enabled: false
      hosts: []
      valuesOverride: {}
  controlPlane:
    apiServer:
      resources: {}
      resourcesPreset: small
    replicas: 1
  version: v1.35
  oidc:
    mode: CustomConfig
    customConfig:
      config: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
        - issuer:
            url: https://idp.byo.example.test
            audiences:
            - cozystack-byo-oidc-byo
          claimMappings:
            username:
              claim: preferred_username
              prefix: ""
            groups:
              claim: groups
              prefix: ""
    users:
    - email: byo-admin@example.test
      role: admin
