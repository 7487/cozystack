# Phase-1 OIDC CustomConfig selector e2e — the rendered control plane and the
# tenant-supplied issuer, with no worker bringup. Not "render-side only": the
# last step waits for the release to finish installing, which requires a serving
# tenant control plane. See the kubernetes-oidc-system suite's header for why
# that wait is there and why it is affordable.
#
# What is exercised on a live cluster: spec.oidc.mode: CustomConfig is
# admitted; the HelmRelease renders; the tenant-supplied
# AuthenticationConfiguration is wired onto the KamajiControlPlane; and —
# crucially — NO Keycloak objects are created in the cozy realm when the
# tenant brings their own issuer, and the placeholder OIDC kubeconfig Secret
# is NOT pre-rendered (System mode pre-renders it; CustomConfig distributes
# out-of-band).
#
# The absence checks run AFTER the positive authn-config Secret assert
# establishes the chart has finished rendering — otherwise a not-yet-
# reconciled HR would false-pass them, a hazard the sequential bats never had.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-oidc-customconfig
spec:
  catch:
  - events:
      timeout: 1m
  - describe:
      timeout: 30s
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kubernetes-oidc-byo
  - describe:
      timeout: 30s
      apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
      kind: KamajiControlPlane
      name: kubernetes-oidc-byo
  # Why these two podLogs selectors: see the kubernetes-oidc-system suite's catch
  # block, which derives it once. The short version is that the Pods explaining a
  # failed Ready wait carry two unrelated label sets -- the chart's own instance
  # label and Kamaji's label for the tenant control plane -- and no single
  # selector spans them. Kept as a pointer rather than a second copy, because a
  # correction would otherwise have to be made twice and the second copy is the
  # one that gets missed.
  - podLogs:
      selector: app.kubernetes.io/instance=kubernetes-oidc-byo
      tail: 50
      timeout: 30s
  - podLogs:
      selector: kamaji.clastix.io/name=kubernetes-oidc-byo
      tail: 50
      timeout: 30s
  # Paired with the census for the reason the kubernetes-oidc-system suite gives:
  # a podLogs collector cannot report that its selector matched nothing, so an
  # empty capture and a stale selector look identical, and neither selector above
  # is pinned by an assert here. That header also states what the census does NOT
  # close -- it is a label check for the instance selector and a presence check
  # for the Kamaji one.
  - script:
      timeout: 2m
      content: |
        set -eu
        cd ../../..
        . hack/e2e-chainsaw/_lib/pod-label-census.sh
        pod_label_census "$NAMESPACE"
  steps:
  - name: create-kubernetes-oidc-byo
    try:
    - apply:
        file: kubernetes-oidc-byo.yaml
    - assert:
        timeout: 1m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: kubernetes-oidc-byo
    - assert:
        timeout: 3m
        resource:
          apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
          kind: KamajiControlPlane
          metadata:
            name: kubernetes-oidc-byo

  - name: kamajicontrolplane-still-carries-authentication-config
    try:
    - assert:
        # Bounded for the same reason as the catch ops here: inheriting
        # timeouts.assert is not the same as being free, and this reads an object
        # the previous step created, so one poll suffices on a healthy run.
        timeout: 1m
        resource:
          apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
          kind: KamajiControlPlane
          metadata:
            name: kubernetes-oidc-byo
          spec:
            apiServer:
              (contains(extraArgs, '--authentication-config=/etc/kubernetes/authentication-config/config.yaml')): true

  - name: authn-config-secret-carries-tenant-issuer
    try:
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kubernetes-oidc-byo-oidc-authn-config
    - script:
        # Bounded like every other op in these suites: no `timeout:` means
        # timeouts.exec, which is 5m of budget for a jq read of a Secret the
        # assert above just proved present.
        timeout: 30s
        content: |
          set -eu
          body=$(kubectl -n "$NAMESPACE" get secret kubernetes-oidc-byo-oidc-authn-config \
            -o jsonpath='{.data.config\.yaml}' | base64 -d)
          echo "$body" | grep -qF "url: https://idp.byo.example.test"
          echo "$body" | grep -qF "cozystack-byo-oidc-byo"
          # Fail-loud negation (a bare `! ... | grep` is vacuous under set -e):
          # the cozy-realm issuer must NOT appear in a BYO config.
          if echo "$body" | grep -qE 'url: https://keycloak\.[^/]+/realms/cozy'; then
            echo "FAIL: BYO AuthenticationConfiguration must not carry the cozy realm issuer" >&2
            exit 1
          fi
        check:
          ($error == null): true

  # Absence proofs — ordered after the positive asserts above (chart has
  # rendered), so `error` op polling to its timeout is a real negative, not a
  # not-yet-reconciled false pass.
  - name: no-keycloak-objects-in-cozy-realm
    try:
    - error:
        timeout: 30s
        resource:
          apiVersion: v1.edp.epam.com/v1
          kind: KeycloakClient
          metadata:
            name: tenant-test-kubernetes-oidc-byo
    - error:
        timeout: 30s
        resource:
          apiVersion: v1.edp.epam.com/v1
          kind: KeycloakClientScope
          metadata:
            name: tenant-test-kubernetes-oidc-byo-audience
    # The third absence proof — no pre-rendered <release>-oidc-kubeconfig — is
    # NOT here. Unlike the two above, which are pure chart-render facts, that
    # Secret has a second possible author: the oidc-bootstrap Job writes it in
    # System mode. Asserting its absence before that Job has run proves only that
    # the Job had not got to it yet, so it moved to the last step, behind the
    # assert that the Job has finished.

  # Last step on purpose, and sized, for the reasons given in the
  # kubernetes-oidc-system suite's own last step, which is where that mechanism
  # is written out. This wait is 20m, the same as that suite carries, and the
  # sameness is the point: both bounds are properties of the chart, not of the
  # suite reading them. The floor is <release>-oidc-bootstrap's own 600s deadline
  # for the admin kubeconfig, and that hook is the same hook here. The ceiling is
  # release.cozystack.io/helm-install-timeout on the ApplicationDefinition, which
  # is the same annotation for every release of this kind. The interval
  # (10m, 20m] does not depend on which suite reads it, so two different numbers
  # would need two different derivations and there is only one.
  #
  # A budget below that floor would red an install whose kubeconfig lands inside
  # the hook's own window, which is the defect this change exists to remove
  # rather than a cheaper version of it.
  #
  # The cost is real, and the wait is the largest single term in it: a failing run
  # of this suite spends 20m of assert against 19m for ../.chainsaw.yaml's two
  # global error.catch legs combined (6m and 13m). Those legs are the cheaper
  # thing to reduce even so, because every failing suite pays them and they are
  # repo-wide, which is #3754 -- but they do not outweigh this wait. The
  # per-suite catch ops here all carry explicit budgets, so this suite's own
  # contribution is a stated number rather than an inherited one.
  #
  # The Job assert that follows needs no LARGE budget of its own, because a
  # release cannot be Ready until it has succeeded -- by the time that assert
  # starts, the Job is in its final state and the assert is a read. It still
  # carries one: 1m below, and it must. The guard added with this change rejects
  # an absent or zero Job budget outright, because an unreadable duration reads
  # back as a sentinel that both numeric comparisons then pass.
  #
  # In CustomConfig mode the oidc-bootstrap Job still writes the tenant
  # ClusterRoleBindings for `users[]` and skips only the System-mode kubeconfig
  # Secret patch, so asserting it here checks the payload this suite otherwise
  # left unchecked — and it is what gives the absence proof below its meaning:
  # after this, the one actor that would have created that Secret has run to
  # completion and did not.
  - name: helmrelease-ready-before-teardown
    try:
    - assert:
        timeout: 20m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: kubernetes-oidc-byo
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 1m
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kubernetes-oidc-byo-oidc-bootstrap
          status:
            succeeded: 1
    # System mode pre-renders <release>-oidc-kubeconfig and the bootstrap Job
    # then fills it in; CustomConfig must do neither. Both of those actors are
    # now finished, so this negative is a decided one.
    - error:
        timeout: 30s
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kubernetes-oidc-byo-oidc-kubeconfig
